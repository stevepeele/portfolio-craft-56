<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Products — Forge</title>
<meta name="description" content="A client-facing products page, forged and run by Forge.">
<style>
  :root{
    --iron:#0b0805;--iron-2:#120d08;--panel:#16100a;--line:#2c2113;--line-soft:#231b10;
    --ink:#ece3d2;--steel:#b3a48a;--dim:#8a7a5f;--ember:#ff6a1a;--ember-deep:#c74e0e;
    --ember-soft:rgba(255,106,26,.14);--accent:#ff6a1a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--iron)}
  body{
    background:radial-gradient(ellipse 70% 26% at 50% 0%, rgba(255,106,26,.07), transparent 70%), var(--iron);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 28px 64px}
  a{color:var(--steel)} a:hover{color:var(--accent)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 0 20px;border-bottom:1px solid var(--line-soft)}
  .wordmark{font-size:26px;font-weight:800;letter-spacing:.03em;line-height:1;text-decoration:none;color:var(--ink)}
  .wordmark .hot{color:var(--ember);text-shadow:0 0 22px rgba(255,106,26,.55)}
  .topbar .side{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .hero{padding:52px 0 8px}
  .sec-label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  h1{font-size:clamp(36px,6.4vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:14px}
  .tag{font-size:19px;color:var(--steel);max-width:56ch}
  .accentbar{height:4px;border-radius:2px;background:var(--accent);box-shadow:0 0 18px var(--accent);margin:30px 0 8px;opacity:.85}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:26px;margin-bottom:16px}
  .card h3{font-size:21px;font-weight:800;margin-bottom:4px}
  .card p{color:var(--steel);font-size:16px;margin-bottom:10px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--dim)}
  .chip{display:inline-block;padding:3px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .chip.live{color:var(--accent);border-color:var(--accent)}
  .chip.building{color:var(--steel)}
  .op{border-left:3px solid var(--accent);padding:12px 16px;background:rgba(255,255,255,.03);font-size:15px;color:var(--steel);margin:22px 0}
  .op strong{color:var(--ink)}
  footer{border-top:1px solid var(--line-soft);padding:32px 0 10px;margin-top:40px;color:var(--dim);font-size:14px}
  .err{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:28px;font-size:16px;color:var(--steel)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="wordmark" href="/forge/">F<span class="hot">O</span>RGE</a>
    <div class="side">Client products page</div>
  </div>

  <main id="page">
    <div class="hero">
      <div class="sec-label" id="p-kind">Forged products</div>
      <h1 id="p-name">…</h1>
      <p class="tag" id="p-tag"></p>
      <div class="accentbar"></div>
    </div>
    <div class="op" id="p-op" hidden></div>
    <div id="p-products"></div>
  </main>

  <footer>
    <p>Forged with <a href="/forge/">Forge</a> — idea in, product out. This page is generated from the client's Forge workspace; products, status, and operator are managed in the <a href="/forge/v3/">v3 console</a>.</p>
  </footer>
</div>

<script src="/forge/v3/data.js"></script>
<script>
(function(){
"use strict";
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function qs(name){
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}
var D = window.FORGE_V3;
var workspaces = D.WORKSPACES, byId = {};
workspaces.forEach(function(w){ byId[w.id] = w; });

/* Console mutations (same origin) win over seed defaults — real local data flow. */
try{
  var raw = localStorage.getItem(D.STATE_KEY);
  if(raw){
    var saved = JSON.parse(raw);
    if(saved && Array.isArray(saved.workspaces) && saved.workspaces.length){
      workspaces = saved.workspaces;
      byId = {};
      workspaces.forEach(function(w){ byId[w.id] = w; });
    }
  }
}catch(e){}

var id = qs("c") || "brightline";
var ws = byId[id];
var page = document.getElementById("page");

if(!ws){
  page.innerHTML = '<div class="hero"><div class="sec-label">Not found</div><h1>No workspace at this address.</h1>' +
    '<p class="tag">The link points at a client workspace that does not exist (yet). Agency workspaces live in the <a href="/forge/v3/">v3 console</a>.</p></div>';
  return;
}
if(ws.kind !== "client"){
  page.innerHTML = '<div class="hero"><div class="sec-label">Agency workspace</div><h1>' + esc(ws.name) + '</h1>' +
    '<p class="tag">This is the agency\'s own forge, not a client page. Client pages: ' +
    workspaces.filter(function(w){ return w.kind === "client"; }).map(function(w){
      return '<a href="/forge/v3/client/?c=' + encodeURIComponent(w.id) + '">' + esc(w.name) + '</a>';
    }).join(" · ") + '</p></div>';
  return;
}

document.title = ws.name + " — Forged Products";
if(ws.accent) document.documentElement.style.setProperty("--accent", ws.accent);
document.getElementById("p-kind").textContent = "Forged for " + (ws.client || ws.name);
document.getElementById("p-name").textContent = ws.name;
document.getElementById("p-tag").textContent = ws.tagline || "";

var tierLabel = (D.TIERS[ws.operator.tier] || {}).label || ws.operator.tier;
var op = document.getElementById("p-op");
op.hidden = false;
op.innerHTML = "<strong>" + esc(ws.operator.name) + "</strong> — this client's operator, running in " +
  esc(tierLabel) + " mode. Money, commitment, and production-deploy steps stop for " +
  esc(ws.contact || "the client") + "'s approval. Always.";

var host = document.getElementById("p-products");
if(!ws.products || !ws.products.length){
  host.innerHTML = '<div class="err">Nothing shipped from this forge yet. The first strike is being prepared.</div>';
}else{
  host.innerHTML = ws.products.map(function(p){
    return '<article class="card"><h3>' + esc(p.name) + '</h3><p>' + esc(p.line) + '</p>' +
      '<div class="meta"><span class="chip ' + (p.status === "live" ? "live" : "building") + '">' +
      (p.status === "live" ? "Live" : "In the forge") + '</span>' +
      (p.forged && p.forged !== "—" ? '<span>Forged ' + esc(p.forged) + '</span>' : '<span>Not yet shipped</span>') +
      (p.url ? '<a href="' + esc(p.url) + '">Visit →</a>' : '') + '</div></article>';
  }).join("");
}
})();
</script>
</body>
</html>
